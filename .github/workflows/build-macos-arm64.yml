name: Build macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      release:
        description: Sign and notarize with configured repository secrets
        required: true
        default: false
        type: boolean
      upload_release:
        description: Upload generated macOS packages to a GitHub Release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to upload assets to, for example v1.0.0
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  build-arm64:
    name: macOS arm64 package and verification
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CODEX_LINK_MAC_RELEASE: ${{ inputs.release && '1' || '0' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm Apple Silicon runner
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Build and verify DMG, ZIP and app
        run: |
          chmod +x scripts/build-macos-arm64.sh
          npm run package:mac:arm64

      - name: Prepare release asset names
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$CODEX_LINK_MAC_RELEASE" == "1" ]]; then
            dmg_asset="dist/Codex-Link-${version}-mac-arm64.dmg"
            zip_asset="dist/Codex-Link-${version}-mac-arm64.zip"
          else
            dmg_asset="dist/Codex-Link-${version}-mac-arm64-unsigned.dmg"
            zip_asset="dist/Codex-Link-${version}-mac-arm64-unsigned.zip"
            cp "dist/Codex-Link-${version}-mac-arm64.dmg" "$dmg_asset"
            cp "dist/Codex-Link-${version}-mac-arm64.zip" "$zip_asset"
          fi
          shasum -a 256 "$dmg_asset" "$zip_asset" > dist/Codex-Link-mac-arm64-SHA256.txt
          {
            echo "DMG_ASSET=$dmg_asset"
            echo "ZIP_ASSET=$zip_asset"
          } >> "$GITHUB_ENV"

      - name: Publish verification summary
        run: |
          cat qa/reports/macos-arm64-release-latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Apple Silicon packages
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Link-mac-arm64-${{ github.run_number }}
          path: |
            ${{ env.DMG_ASSET }}
            ${{ env.ZIP_ASSET }}
            dist/Codex-Link-mac-arm64-SHA256.txt
            qa/reports/macos-arm64-release-latest.json
            qa/reports/macos-arm64-release-latest.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload packages to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.DMG_ASSET }}
            ${{ env.ZIP_ASSET }}
            dist/Codex-Link-mac-arm64-SHA256.txt
            qa/reports/macos-arm64-release-latest.json
            qa/reports/macos-arm64-release-latest.md
